<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <meta name="description" content="Contact form for Gonzalo Ezequiel Peralta">
    <meta name="author" content="Gonzalo Ezequiel Peralta">
    <meta name="keywords" content="Gonzalo Ezequiel Peralta, contact form, contact">
    <meta property="og:title" content="Contact Form">
    <meta property="og:description" content="Contact form for Gonzalo Ezequiel Peralta">
    <meta property="og:type" content="website">
    <link rel="icon" href="favicon-32x32.png" type="image/png">
</head>
<body>
    <header class="site-header">
        <h1 class="site-logo">Acme Support</h1>
        <nav aria-label="Principal">
            <ul class="site-nav-list">
                <li class="site-nav-item"><a href="contacform.html">Home</a></li>
                <li class="site-nav-item"><a href="help.html">Help</a></li>
                <li class="site-nav-item"><a href="contacform.html">Contact</a></li>
            </ul>
        <hr class="separator">
        </nav>    
    </header>
    <main>
        <h1>Contact Us</h1>
        <p>Send us a message and we will get back to you</p>

        <form action="https://example.com/contact" method="post">
            <fieldset>
                <div>
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" required>
                </div><br>
                <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                </div><br>
                <div>
                <label for="subject">Subject</label>
                <select name="subject" id="subject" required>
                    <option value="" selected disabled>Choose a topic</option>
                    <option value="billing">Billing</option>
                    <option value="technical">TechnicalSupport</option>
                    <option value="account">Account</option>
                </select>
                </div><br>
                <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" minlength="20" required></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>How did you hear about us?</legend>
                <label><input type="radio" name="source" value="search">Search</label>
                <label><input type="radio" name="source" value="friend">Friend</label>
                <label><input type="radio" name="source" value="social">Social media</label>
            </fieldset>

            <div>
                <label>
                    <input type="checkbox" name="updates" value="yes">
                    Send me product updates
            </div>

            <button type="submit">Send Message</button>

        </form>
        <hr class="separator">
        <footer>
            <p>© 2026 Acme Support</p>
        </footer>
    </main>
</body>
</html>
